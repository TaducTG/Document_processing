name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Linters & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx aiosqlite python-multipart boto3 sqlalchemy alembic pydantic-settings pymupdf pdfplumber

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pytest Suite
        run: pytest tests/ -v

